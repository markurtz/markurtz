# pnpm settings for this single-package repository.
# Reference: https://pnpm.io/settings

# Supply-chain hardening ------------------------------------------------------
# Only install versions that have been public for at least 3 days (in minutes).
# Most malicious releases are detected and unpublished well within this window.
minimumReleaseAge: 4320
# Fail if a package's publishing trust level (trusted publisher / provenance)
# is weaker than an earlier release of the same package.
trustPolicy: no-downgrade

# Fail the install when a dependency declares an incompatible Node.js version.
engineStrict: true

# Dependency build (postinstall) scripts are blocked unless approved here.
# Review a package before setting it to `true`.
# esbuild and sharp both ship prebuilt binaries as optional dependencies and
# work without their install scripts, so the scripts stay blocked.
allowBuilds:
  esbuild: false
  sharp: false

# Velite pins an older sharp with known advisories in its bundled image
# libraries. Use the patched release everywhere. Remove once Velite updates.
overrides:
  "velite>sharp": "^0.35.5"
