# =============================================================================
# weekly.yml — The Janitor
#
# Trigger:  Cron 00:00 UTC every Sunday + manual workflow_dispatch
# Purpose:  Catch drift that no commit triggered: newly disclosed
#           vulnerabilities, broken external links, and test regressions.
# =============================================================================
name: "CI — Weekly Housekeeping"

on:
  schedule:
    - cron: "0 0 * * 0" # 00:00 UTC every Sunday
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  # ── Stage 1: Security Audit ────────────────────────────────────────────────
  security:
    name: "Security Audit"
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write

  # ── Stage 2: Full Test Suite ───────────────────────────────────────────────
  tests:
    name: "Full Verification Suite"
    uses: ./.github/workflows/_tests.yml
    with:
      test_levels: '["unit", "integration", "e2e"]'
      generate_coverage: true
      retention_days: 14

  # ── Stage 3: Link Check ────────────────────────────────────────────────────
  link-check:
    name: "Link Check"
    uses: ./.github/workflows/_link-check.yml
    with:
      fail_on_error: true
