# ─────────────────────────────────────────────────────────────────────────────
# _link-check.yml — Reusable Link Checker
#
# Validates that hyperlinks in the repository's Markdown and MDX files are
# reachable and not returning errors.
#
# Inputs:
#   fail_on_error — whether to fail the workflow on broken links (default: true)
#
# Callers: weekly.yml
# ─────────────────────────────────────────────────────────────────────────────
name: "Link Checker (Reusable)"

on:
  workflow_call:
    inputs:
      fail_on_error:
        description: "Fail the workflow if broken links are detected"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  link-check:
    name: "Check Links"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --accept 200,206,301,302,429
            --exclude-loopback --exclude-mail
            --exclude-path node_modules
            '**/*.md' '**/*.mdx'
          fail: ${{ inputs.fail_on_error }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
