# =============================================================================
# main.yml — Post-Merge CI
#
# Triggers:
#   push → main
#
# Stage 1 — Quality Gate & Security Audit
# Stage 2 — Tests (Unit, Integration, E2E)
# Stage 3 — Build
#
# Production deployment is handled by Vercel's Git integration, not by this
# workflow.
# =============================================================================
name: "CI — Main"

on:
  push:
    branches:
      - main

concurrency:
  group: "main-${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1: Quality Gate & Security ───────────────────────────────────────
  quality:
    name: "Quality Gate"
    uses: ./.github/workflows/_quality.yml

  security:
    name: "Security Audit"
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write

  # ── Stage 2: Tests ─────────────────────────────────────────────────────────
  tests:
    name: "Run Tests"
    uses: ./.github/workflows/_tests.yml
    with:
      test_levels: '["unit", "integration", "e2e"]'
      generate_coverage: true
      retention_days: 14

  # ── Stage 3: Build ─────────────────────────────────────────────────────────
  build:
    name: "Build"
    uses: ./.github/workflows/_build.yml
