# =============================================================================
# keepalive.yml — Daily Health Check and Housekeeping
#
# Trigger:  Cron 07:17 UTC daily + manual workflow_dispatch
#
# 1. Calls /api/health, which runs one database query. Free Supabase projects
#    pause after a week without activity, and this keeps the project awake.
# 2. Calls /api/cron/archive-expired to archive client galleries whose expiry
#    has passed.
#
# Note: GitHub disables scheduled workflows in a public repository after 60
# days without repository activity and emails the owner. Re-enable it from the
# Actions tab if that happens.
#
# Variables:  SITE_URL — the production origin, for example https://example.com
#             (the workflow does nothing until this is set)
# Secrets:    CRON_SECRET — the same value as the Vercel environment variable
# =============================================================================
name: "Keepalive"

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    name: "Health Check"
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check health
        run: curl --fail --silent --show-error --retry 3 --max-time 30 "$SITE_URL/api/health"

      - name: Archive expired galleries
        if: env.CRON_SECRET != ''
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --request POST --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/archive-expired"
