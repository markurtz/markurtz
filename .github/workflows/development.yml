# =============================================================================
# development.yml — PR CI
#
# Triggers:
#   pull_request → main
#
# Stage 1 — Quality & Security
# Stage 2 — Tests (Unit, Integration, E2E)
# Stage 3 — Build
# Stage 4 — Gate (single required status check)
#
# Preview deployments are created by Vercel's Git integration, not by this
# workflow.
# =============================================================================
name: "CI — Development"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: "dev-${{ github.head_ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1: Quality & Security ────────────────────────────────────────────
  quality:
    name: "Quality Gate"
    uses: ./.github/workflows/_quality.yml

  security:
    name: "Security Audit"
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write

  # ── Stage 2: Tests ─────────────────────────────────────────────────────────
  tests:
    name: "Run Tests"
    uses: ./.github/workflows/_tests.yml
    with:
      test_levels: '["unit", "integration", "e2e"]'
      generate_coverage: true
      retention_days: 7

  # ── Stage 3: Build ─────────────────────────────────────────────────────────
  build:
    name: "Build"
    uses: ./.github/workflows/_build.yml

  # ── Stage 4: Gate ──────────────────────────────────────────────────────────
  # Require only this job in branch protection; it fails unless every stage
  # above succeeded, so new jobs are covered without changing repo settings.
  ci-passed:
    name: "CI Passed"
    if: always()
    needs: [quality, security, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all stages succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Stage results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "[ERROR] At least one stage did not succeed."
              exit 1
            fi
          done
