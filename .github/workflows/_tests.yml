# ─────────────────────────────────────────────────────────────────────────────
# _tests.yml — Reusable Test Runner
#
# Executes the project test suite for the requested levels.
#
#   unit, integration — Vitest projects (tests/unit, tests/integration)
#   e2e               — Playwright against the production build (tests/e2e)
#
# Inputs:
#   test_levels       (required) — JSON array of levels, e.g. '["unit","e2e"]'
#   generate_coverage (optional) — Collect coverage for Vitest levels (default: false)
#   retention_days    (optional) — Days to retain uploaded artifacts (default: 7)
#
# Callers: development.yml, main.yml, weekly.yml
# ─────────────────────────────────────────────────────────────────────────────
name: "Test Runner (Reusable)"

on:
  workflow_call:
    inputs:
      test_levels:
        description: "JSON array of test levels to run: unit, integration, e2e"
        required: true
        type: string
      generate_coverage:
        description: "Generate a coverage report for unit and integration levels"
        required: false
        type: boolean
        default: false
      retention_days:
        description: "Days to retain test artifacts"
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  run-tests:
    name: "Run ${{ matrix.level }} Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJson(inputs.test_levels) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      # ── Unit & Integration (Vitest) ────────────────────────────────────────
      - name: Run ${{ matrix.level }} tests
        if: matrix.level != 'e2e'
        env:
          TEST_LEVEL: ${{ matrix.level }}
          COVERAGE: ${{ inputs.generate_coverage }}
        run: |
          if [ "$COVERAGE" = "true" ]; then
            pnpm exec vitest run --project "$TEST_LEVEL" --coverage
          else
            pnpm exec vitest run --project "$TEST_LEVEL"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.level != 'e2e' && inputs.generate_coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.level }}-${{ github.run_id }}
          path: coverage/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: ignore

      # ── End-to-End (Playwright) ────────────────────────────────────────────
      - name: Install Playwright browser
        if: matrix.level == 'e2e'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        if: matrix.level == 'e2e'
        run: pnpm build

      - name: Run e2e tests
        if: matrix.level == 'e2e'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && matrix.level == 'e2e' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: ignore
