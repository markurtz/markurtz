# ─────────────────────────────────────────────────────────────────────────────
# _quality.yml — Reusable Quality Gate
#
# Encapsulates linting (ESLint), formatting (Prettier), and type checking
# (TypeScript). Fails the pipeline if any of these checks fail.
#
# Callers:  development.yml, main.yml
# ─────────────────────────────────────────────────────────────────────────────
name: "Quality Gate (Reusable)"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

  format:
    name: "Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run Prettier
        run: pnpm format:check

  types:
    name: "Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Run TypeScript
        run: pnpm typecheck
