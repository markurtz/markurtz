# =============================================================================
# dependabot.yml — Automated Dependency Management
#
# GitHub Dependabot natively creates PRs for outdated dependencies.
# Updates are grouped to minimize PR noise (one PR per group per week).
#
# Ecosystems:
#   • github-actions — workflow action version pins (SHA + version comment)
#   • npm            — Node.js packages (pnpm lockfile)
#
# Reviews are requested through CODEOWNERS. The cooldown delays updates until
# a release has been public for a while, which pairs with `minimumReleaseAge`
# in pnpm-workspace.yaml as protection against compromised releases. Security
# updates are not subject to the cooldown.
# =============================================================================
version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions are listed explicitly.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    # Group all action updates into a single PR to reduce noise
    groups:
      github-actions-updates:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    assignees: ["markurtz"]
    open-pull-requests-limit: 5

  # ── Node.js (pnpm) ──────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        update-types:
          - "minor"
          - "patch"
      npm-major-dependencies:
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    assignees: ["markurtz"]
    open-pull-requests-limit: 5
