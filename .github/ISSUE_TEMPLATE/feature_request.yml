name: ✨ Feature Request
description: Suggest an idea or improvement for the website
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement!

        Before submitting, please search the existing [issues](https://github.com/markurtz/markurtz/issues) to see if it has already been requested.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: "Ex. I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request here.
  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      description: Would you be willing to contribute a pull request for this feature?
      options:
        - label: Yes, I am willing to submit a PR!
