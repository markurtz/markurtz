name: 🐛 Bug Report
description: Report something broken on the website or in this repository
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!

        > [!IMPORTANT]
        > If you have found a **security vulnerability**, please follow the [Security Policy](https://github.com/markurtz/markurtz/security/policy) and do not open a public issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Search before asking
      options:
        - label: I have searched the [existing issues](https://github.com/markurtz/markurtz/issues) and could not find a similar report.
          required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The address of the page where the problem occurs, if applicable.
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: The exact steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide details about where you saw the problem.
      value: |
        - Device (e.g., desktop, iPhone 16):
        - OS (e.g., macOS, Windows, iOS, Android):
        - Browser and version (e.g., Chrome 142, Safari 26):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Console Output
      description: If applicable, add screenshots or paste browser console output. Please use code blocks (```) to format logs.
    validations:
      required: false
